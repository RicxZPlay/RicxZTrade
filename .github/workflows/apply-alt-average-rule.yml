name: Apply altcoin MA and LSMA grouping rule

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-alt-average-rule.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply scanner rule changes
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceChecked(text, pattern, replacement, label) {
            const next = text.replace(pattern, replacement);
            if (next === text) throw new Error(`Patch not applied: ${label}`);
            return next;
          }

          let market = fs.readFileSync('src/market.js', 'utf8');
          market = replaceChecked(
            market,
            'export const ALT_HISTORY_LIMIT = 3500;',
            'export const ALT_HISTORY_LIMIT = 4200;',
            'ALT_HISTORY_LIMIT for LSMA'
          );
          market = replaceChecked(
            market,
            /  const ma800 = toChartSma\(candles, ALT_MA_PERIOD\)\.at\(-1\)\?\.value;\r?\n  const adxSeries = calculateADX\(candles, ADX_PERIOD\);/,
            '  const ma800 = toChartSma(candles, ALT_MA_PERIOD).at(-1)?.value;\n  const lsma3800 = toChartLsma(candles, ALT_LSMA_PERIOD).at(-1)?.value;\n  const adxSeries = calculateADX(candles, ADX_PERIOD);',
            'scanner LSMA calculation'
          );
          market = replaceChecked(
            market,
            /  if \(!\[price, ma800\]\.every\(Number\.isFinite\)\) \{\r?\n    return null;\r?\n  \}\r?\n\r?\n  let trendDirection = "neutral";\r?\n  if \(price < ma800\) trendDirection = "bearish";\r?\n  if \(price > ma800\) trendDirection = "bullish";\r?\n  const priceDistancePercent = \(\(price - ma800\) \/ ma800\) \* 100;/,
            `  if (![price, ma800, lsma3800].every(Number.isFinite)) {\n    return null;\n  }\n\n  const averages = [ma800, lsma3800];\n  const aboveAnyAverage = averages.some((averageValue) => price > averageValue);\n  const belowAnyAverage = averages.some((averageValue) => price < averageValue);\n  let trendDirection = "neutral";\n  if (aboveAnyAverage && !belowAnyAverage) trendDirection = "bullish";\n  else if (belowAnyAverage && !aboveAnyAverage) trendDirection = "bearish";\n  else if (aboveAnyAverage && belowAnyAverage) trendDirection = price >= average(averages) ? "bullish" : "bearish";\n  const referenceAverage = averages\n    .map((averageValue) => ({ value: averageValue, distance: Math.abs(price - averageValue) }))\n    .sort((a, b) => a.distance - b.distance)[0]?.value;\n  const priceDistancePercent = ((price - referenceAverage) / referenceAverage) * 100;`,
            'scanner MA/LSMA direction rule'
          );
          market = replaceChecked(
            market,
            '  const trend = getAltTrendLabel(trendDirection);',
            '  const trend = getAltTrendLabel({ aboveAnyAverage, belowAnyAverage });',
            'trend label input'
          );
          market = replaceChecked(
            market,
            /    ma800,\r?\n    priceDistancePercent,/,
            '    ma800,\n    lsma3800,\n    priceDistancePercent,',
            'return lsma3800'
          );
          market = replaceChecked(
            market,
            /    trendDirection,\r?\n    trend,/,
            '    trendDirection,\n    aboveAnyAverage,\n    belowAnyAverage,\n    trend,',
            'return average flags'
          );
          market = replaceChecked(
            market,
            /function getAltTrendLabel\(direction\) \{\r?\n  if \(direction === "bearish"\) return "abaixo da MA 800";\r?\n  if \(direction === "bullish"\) return "acima da MA 800";\r?\n  return "fora das zonas";\r?\n\}/,
            `function getAltTrendLabel(direction) {\n  if (direction?.aboveAnyAverage && direction?.belowAnyAverage) return "entre MA 800 e LSMA 3800";\n  if (direction?.belowAnyAverage) return "abaixo de MA/LSMA";\n  if (direction?.aboveAnyAverage) return "acima de MA/LSMA";\n  return "fora das zonas";\n}`,
            'MA/LSMA label'
          );
          fs.writeFileSync('src/market.js', market);

          let app = fs.readFileSync('src/App.jsx', 'utf8');
          app = replaceChecked(
            app,
            '  const belowResults = useMemo(() => results.filter((item) => item.trendDirection === "bearish"), [results]);',
            '  const belowResults = useMemo(() => results.filter((item) => item.belowAnyAverage), [results]);',
            'below list filter'
          );
          app = replaceChecked(
            app,
            '  const aboveResults = useMemo(() => results.filter((item) => item.trendDirection === "bullish"), [results]);',
            '  const aboveResults = useMemo(() => results.filter((item) => item.aboveAnyAverage), [results]);',
            'above list filter'
          );
          app = replaceChecked(app, 'label="Abaixo da MA 800"', 'label="Abaixo MA/LSMA"', 'below stat label');
          app = replaceChecked(app, 'label="Acima da MA 800"', 'label="Acima MA/LSMA"', 'above stat label');
          app = app.replaceAll('abaixo da MA 800', 'abaixo de MA/LSMA');
          app = app.replaceAll('acima da MA 800', 'acima de MA/LSMA');
          app = replaceChecked(
            app,
            /filteredBelowResults\.map\(\(item\) => \(\r?\n                  <CoinRow/,
            'filteredBelowResults.map((item) => (\n                  <CoinRow\n                    zone="below"',
            'below row zone'
          );
          app = replaceChecked(
            app,
            /filteredAboveResults\.map\(\(item\) => \(\r?\n                  <CoinRow/,
            'filteredAboveResults.map((item) => (\n                  <CoinRow\n                    zone="above"',
            'above row zone'
          );
          app = replaceChecked(
            app,
            'function CoinRow({ item, selectedSymbol, favorite, onSelect, onToggleFavorite }) {\n  const isAbove = item.trendDirection === "bullish";',
            'function CoinRow({ item, selectedSymbol, favorite, onSelect, onToggleFavorite, zone }) {\n  const isAbove = zone === "above" || (!zone && item.trendDirection === "bullish");',
            'coin row zone style'
          );
          fs.writeFileSync('src/App.jsx', app);
          NODE

      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Commit source changes and remove workflow
        run: |
          rm .github/workflows/apply-alt-average-rule.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/market.js src/App.jsx .github/workflows/apply-alt-average-rule.yml
          git commit -m "Use MA and LSMA for altcoin grouping"
          git push
